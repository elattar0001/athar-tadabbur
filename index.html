<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache">
<title>تدبّر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'QCF_P001';src:url(https://am9li9.com/fonts/QCF1/QCF_P001.woff2) format('woff2');font-display:block}
@font-face{font-family:'QCF_P192';src:url(https://am9li9.com/fonts/QCF1/QCF_P192.woff2) format('woff2');font-display:block}
@font-face{font-family:'QCF_P193';src:url(https://am9li9.com/fonts/QCF1/QCF_P193.woff2) format('woff2');font-display:block}
@font-face{font-family:'QCF_P194';src:url(https://am9li9.com/fonts/QCF1/QCF_P194.woff2) format('woff2');font-display:block}
@font-face{font-family:'QCF_P195';src:url(https://am9li9.com/fonts/QCF1/QCF_P195.woff2) format('woff2');font-display:block}
@font-face{font-family:'KFGQPC';src:url(https://raw.githubusercontent.com/nuqayah/qpc-fonts/master/mushaf-v4-hafs/uthmanic_hafs_v22.ttf) format('truetype');font-display:block}
:root{--bg:#ffffff;--ink:#0f1b17;--mut:#56645e;--line:#cfd9d4;--soft:#e9f0ed;--g:#0b6a4f;--g2:#07513c;--gl:#c8e6da;--lh:54px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
#top{display:flex;align-items:center;gap:12px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
#av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--gl);border:1px solid #cfe7df}
#av svg{width:22px;height:22px;fill:none;stroke:var(--g);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#meta{flex:1;min-width:0;text-align:right}
#reciter{font-size:17px;line-height:1.5;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title{font-size:12.5px;line-height:1.6;color:#33423c;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tags{display:block;margin:0;font-size:11.5px;line-height:1.6;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline;font-size:inherit;color:inherit;background:none;border:0;padding:0}
.tag+.tag::before{content:" · ";color:#b9c3be}
.tag b{color:var(--g);font-weight:600}
#stage{flex:1;min-height:0;overflow-y:auto;padding:6px 0;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.vcard{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 32px rgba(15,27,23,.13),0 2px 6px rgba(15,27,23,.08);padding:10px 16px 8px;position:relative}
#chip{display:inline-block;font-size:12px;font-weight:600;color:var(--g);background:var(--gl);border-radius:20px;padding:1px 12px;line-height:1.9;margin:4px 0 2px}
#win{height:calc(4 * var(--lh));overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(#0000,#000 14%,#000 86%,#0000);mask-image:linear-gradient(#0000,#000 14%,#000 86%,#0000)}
#flow{font-size:23px;line-height:var(--lh);text-align:center;width:100%;color:#7a8882;margin:0;transition:transform .35s cubic-bezier(.3,.7,.2,1);will-change:transform}
#flow.pop{animation:pop .16s ease-out}
@keyframes pop{from{opacity:.2}to{opacity:1}}
#flow span.w{border-radius:10px;transition:color .1s,background-color .1s;padding:0 1px}
#flow span.d{color:var(--ink)}
#flow span.c{color:var(--g2);background:var(--gl);box-shadow:0 0 0 3px var(--gl)}
#flow span.e{color:var(--g)}
#taf{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:12px 16px;text-align:right}
#taf h4{margin:0 0 4px;font-size:12.5px;color:var(--g);font-weight:600;display:flex;align-items:center;gap:6px}
#taf h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--g)}
#tt{font-size:15px;line-height:1.95;color:#1f2c27}
#prog{margin-top:8px}
#track{position:relative;height:8px;background:#cdd9d3;border-radius:8px;direction:ltr;cursor:pointer;touch-action:none}
#track::after{content:"";position:absolute;inset:-12px 0}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--g);border-radius:8px}
#fill::after{content:"";position:absolute;right:-7px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--g);box-shadow:0 2px 6px rgba(11,106,79,.4)}
#times{display:flex;justify-content:space-between;direction:ltr;color:var(--mut);font-size:12.5px;margin-top:10px;font-variant-numeric:tabular-nums}
#ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px;direction:ltr}
.cb{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s}
.cb:active{transform:scale(.94);background:var(--soft)}
.cb svg{width:22px;height:22px;fill:var(--ink)}
.cb.on{border-color:var(--g);background:var(--gl)}.cb.on svg{fill:var(--g)}
#play{width:70px;height:70px;border:0;background:var(--g);box-shadow:0 10px 24px rgba(11,106,79,.4)}
#play:active{background:var(--g2)}
#play svg{width:32px;height:32px;fill:#fff}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <div id="meta"><div id="reciter"></div><div id="title">…</div><div id="tags"></div></div>
 </div>
 <div id="stage">
  <div class="vcard" id="vc"><div style="text-align:center"><span id="chip"></span></div><div id="win"><div id="flow"></div></div></div>
  <div id="taf" style="display:none"><h4>التفسير الميسَّر</h4><div id="tt"></div></div>
 </div>
 <div id="prog"><div id="track"><div id="fill"></div></div><div id="times"><span id="cur">00:00</span><span id="rem">-00:00</span></div></div>
 <div id="ctl">
  <button class="cb" id="next" aria-label="الآية التالية"><svg viewBox="0 0 24 24"><path d="M5 6l8 6-8 6V6zm8 0l8 6-8 6V6z"/></svg></button>
  <button class="cb" id="play" aria-label="تشغيل"><svg id="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="cb" id="prev" aria-label="الآية السابقة"><svg viewBox="0 0 24 24"><path d="M19 6l-8 6 8 6V6zm-8 0l-8 6 8 6V6z"/></svg></button>
  <button class="cb" id="rep" aria-label="تكرار الآية"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
 </div>
 <audio id="a" preload="metadata"></audio>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#ffffff');tg.setBackgroundColor('#ffffff');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=id=>document.getElementById(id),a=$('a');
const AR='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
const LEAD=0.12;
let D,ev=[],cur=-1,curCard=null,rep=false,drag=false,spans=[],lastTop=-1,cardIdx={},base0=0,curWanted=0;
const q=new URLSearchParams(location.search);
const LH=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lh'))||54;
fetch((q.get('d')||'data.json')+'?v='+Date.now()).then(r=>r.json()).then(d=>{
 D=d;ev=d.ev;$('title').textContent=d.title;$('reciter').textContent=d.reciter;
 $('tags').innerHTML=(d.tags||[]).map(t=>`<span class="tag">${t[0]}: <b>${t[1]}</b></span>`).join('');
 d.words.forEach((w,i)=>{(cardIdx[w.c]=cardIdx[w.c]||[]).push(i)});
 a.src=d.audio;const t=parseFloat(q.get('t'));if(t>0)a.addEventListener('loadedmetadata',()=>{a.currentTime=t},{once:true});
 setWord(0,true);tick();
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{lastTop=-1;relayout()}).catch(()=>{});
 setTimeout(relayout,1500);
});
function find(t){let lo=0,hi=ev.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(ev[m][0]<=t){r=m;lo=m+1}else hi=m-1}return r}
function relayout(){lastTop=-1;if(D&&curCard){measure();setWord(curWanted,true)}}
function measure(){const f=$('flow'),lh=LH(),h=f.scrollHeight;base0=h<4*lh?Math.round((4*lh-h)/2):0}
function renderCard(c){
 const f=$('flow'),ids=cardIdx[c],v=D.verses[c];
 f.style.fontFamily="'"+v.font+"','KFGQPC',serif";f.style.fontSize=c==='basm'?'30px':'';
 f.innerHTML=ids.map(i=>`<span class="w${D.words[i].end?' e':''}" data-i="${i}">${D.words[i].t}</span>${D.words[i].br?'<br>':' '}`).join('');
 spans=[...f.querySelectorAll('span.w')];
 spans.forEach(sp=>sp.onclick=()=>{const i=+sp.dataset.i;for(let k=0;k<ev.length;k++)if(ev[k][1]===i){a.currentTime=ev[k][0];break}});
 f.style.transition='none';f.style.transform='translateY(0)';lastTop=-1;
 f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');
 curCard=c;cur=-2;measure();void f.offsetWidth;f.style.transition='';
 $('chip').textContent=v.label?v.label:'سورة التوبة · الآية '+ar(v.n);
 $('tt').textContent=v.tafsir;$('taf').style.display='';
}
function setWord(w,force){
 curWanted=w;const c=D.words[w].c;
 if(c!==curCard)renderCard(c);
 else if(w===cur&&!force)return;
 const base=cardIdx[c][0],k=w-base;
 spans.forEach((sp,i)=>{sp.classList.toggle('d',i<k);sp.classList.toggle('c',i===k)});
 cur=w;
 const top=spans[k]?spans[k].offsetTop:0;
 if(top!==lastTop){lastTop=top;$('flow').style.transform=`translateY(${base0-Math.max(0,top-LH())}px)`}
}
function now(){return q.get('fake')?+q.get('fake'):a.currentTime}
function tick(){
 if(!D)return;
 const t=now(),d=a.duration||0;
 if(!drag)$('fill').style.width=d?(t/d*100)+'%':'0';
 $('cur').textContent=fmt(t);$('rem').textContent='-'+fmt(d-t);
 const i=find(t+LEAD);
 setWord(i<0?0:ev[i][1]);
}
a.addEventListener('timeupdate',tick);a.addEventListener('loadedmetadata',tick);a.addEventListener('seeked',tick);
(function loop(){if(!a.paused)tick();requestAnimationFrame(loop)})();
window.addEventListener('resize',relayout);
const PL='M8 5v14l11-7z',PA='M6 5h4v14H6zm8 0h4v14h-4z';
$('play').onclick=()=>{a.paused?a.play():a.pause()};
a.addEventListener('play',()=>{$('ic').innerHTML=`<path d="${PA}"/>`});
a.addEventListener('pause',()=>{$('ic').innerHTML=`<path d="${PL}"/>`});
function seekTo(x){const r=$('track').getBoundingClientRect();const p=Math.min(1,Math.max(0,(x-r.left)/r.width));a.currentTime=p*a.duration;$('fill').style.width=p*100+'%';tick()}
$('track').addEventListener('pointerdown',e=>{drag=true;$('track').setPointerCapture(e.pointerId);seekTo(e.clientX)});
$('track').addEventListener('pointermove',e=>{if(drag)seekTo(e.clientX)});
$('track').addEventListener('pointerup',()=>drag=false);
function vk(i){return D.words[ev[i][1]].c}
function jump(dir){const t=a.currentTime;let i=find(t);if(i<0)i=0;
 if(dir>0){for(let j=i+1;j<ev.length;j++){if(vk(j)!==vk(i)){a.currentTime=ev[j][0];return}}}
 else{let st=i;while(st>0&&vk(st-1)===vk(i))st--;if(t-ev[st][0]>3){a.currentTime=ev[st][0];return}
  if(st>0){let s2=st-1;while(s2>0&&vk(s2-1)===vk(st-1))s2--;a.currentTime=ev[s2][0];return}a.currentTime=0}}
$('next').onclick=()=>jump(1);$('prev').onclick=()=>jump(-1);
$('rep').onclick=()=>{rep=!rep;$('rep').classList.toggle('on',rep)};
setInterval(()=>{if(!rep||a.paused||!D)return;const i=find(a.currentTime);if(i<0)return;let st=i;while(st>0&&vk(st-1)===vk(i))st--;let en=i;while(en<ev.length-1&&vk(en+1)===vk(i))en++;if(en<ev.length-1&&a.currentTime>=ev[en+1][0]-0.1)a.currentTime=ev[st][0]},120);
</script>
</body></html>
