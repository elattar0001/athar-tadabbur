<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050605">
<title>تدبّر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050605;--sheet:#0c0e0b;--card:#101310;--line:#232a1c;--lime:#c9e81f;--lime2:#9db615;--txt:#f2f4ee;--mut:#8f9886}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Noto Naskh Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:linear-gradient(180deg,#0d100b 0%,var(--sheet) 40%);border-top:2px solid #20290f;border-radius:22px 22px 0 0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));position:relative}
#app::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--lime),transparent);opacity:.8}
#grab{width:44px;height:4px;border-radius:4px;background:#2d3a14;margin:2px auto 12px}
#top{display:flex;align-items:center;gap:12px}
#av{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--lime);box-shadow:0 0 0 5px #11160a,0 0 0 6px #3a4a12,0 0 22px rgba(201,232,31,.25);background:radial-gradient(circle at 50% 40%,#1b2208,#0a0c06)}
#av svg{width:30px;height:30px;fill:none;stroke:var(--lime);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#meta{flex:1;min-width:0;text-align:right}
#title{font-size:15px;line-height:1.7;color:#f4f6ef;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reciter{font-size:17px;line-height:1.7;color:var(--lime);font-weight:700}
#tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.tag{font-size:11.5px;color:#d5dbc9;background:#13170f;border:1px solid var(--line);border-radius:10px;padding:2px 9px;line-height:1.7}
.tag b{color:var(--lime);font-weight:600}
#stage{flex:1;min-height:0;overflow-y:auto;padding:14px 0 6px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.vcard{border:1px solid #2a3320;border-radius:18px;background:linear-gradient(180deg,#121610,#0d100b);padding:22px 16px;text-align:center;position:relative;transition:border-color .4s}
.vcard.live{border-color:#3d4a22}
#verse{font-family:'Amiri Quran','Noto Naskh Arabic',serif;font-size:clamp(25px,6.3vw,33px);line-height:2.25;color:#eef1e8;transition:opacity .3s ease,transform .3s ease}
#verse.out{opacity:0;transform:translateY(6px)}
.num{display:inline-grid;place-items:center;width:1.55em;height:1.55em;margin:0 .3em;border:1.5px solid var(--lime2);border-radius:50%;color:var(--lime);font-size:.5em;vertical-align:middle;font-family:'Amiri Quran',serif;line-height:1}
#where{margin-top:8px;font-size:13px;color:var(--mut)}
#note{display:none;margin-top:8px;font-size:12px;color:#0b0d07;background:var(--lime);border-radius:10px;padding:1px 10px}
#taf{border:1px solid var(--line);border-radius:16px;background:#0e110c;padding:14px 16px;text-align:right;transition:opacity .3s}
#taf h4{margin:0 0 6px;font-size:13px;color:var(--lime);font-weight:600;display:flex;align-items:center;gap:6px}
#taf h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime)}
#tt{font-size:17.5px;line-height:2;color:#cfd6c4}
#prog{margin-top:8px}
#track{position:relative;height:12px;background:#262b20;border-radius:12px;direction:ltr;cursor:pointer;touch-action:none}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--lime);border-radius:12px}
#times{display:flex;justify-content:space-between;direction:ltr;color:#a8b09b;font-size:13px;margin-top:9px;font-family:system-ui;font-variant-numeric:tabular-nums}
#ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px;direction:ltr}
.cb{width:58px;height:58px;border-radius:50%;border:1px solid #2c3422;background:#0f130c;color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s}
.cb:active{transform:scale(.94);background:#171d10}
.cb svg{width:24px;height:24px;fill:var(--txt)}
.cb.on{border-color:var(--lime);background:#1a2108}.cb.on svg{fill:var(--lime)}
#play{width:74px;height:74px;border:0;background:none}
#play svg{width:38px;height:38px;fill:var(--lime)}
</style>
</head>
<body>
<div id="app">
 <div id="grab"></div>
 <div id="top">
  <div id="av"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.6 4 5v12.5c3-.4 6 0 8 1.5 2-1.5 5-1.9 8-1.5V5c-3-.4-6 0-8 1.5Z"/><path d="M12 6.5V19"/></svg></div>
  <div id="meta"><div id="title">…</div><div id="reciter"></div><div id="tags"></div></div>
 </div>
 <div id="stage">
  <div class="vcard" id="vc"><div id="verse">جارٍ التحميل…</div><div id="where"></div><div id="note">تكرار من القارئ</div></div>
  <div id="taf" style="display:none"><h4>التفسير الميسَّر</h4><div id="tt"></div></div>
 </div>
 <div id="prog"><div id="track"><div id="fill"></div></div><div id="times"><span id="cur">00:00</span><span id="rem">-00:00</span></div></div>
 <div id="ctl">
  <button class="cb" id="next" aria-label="الآية التالية"><svg viewBox="0 0 24 24"><path d="M5 6l8 6-8 6V6zm8 0l8 6-8 6V6z"/></svg></button>
  <button class="cb" id="play" aria-label="تشغيل"><svg id="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="cb" id="prev" aria-label="الآية السابقة"><svg viewBox="0 0 24 24"><path d="M19 6l-8 6 8 6V6zm-8 0l-8 6 8 6V6z"/></svg></button>
  <button class="cb" id="rep" aria-label="تكرار الآية"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
 </div>
 <audio id="a" preload="auto"></audio>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#050605');tg.setBackgroundColor('#050605');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=id=>document.getElementById(id),a=$('a');
const AR='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
let D,ev=[],idx=-1,rep=false,drag=false;
const q=new URLSearchParams(location.search);
fetch((q.get('d')||'data.json')+'?v='+Date.now()).then(r=>r.json()).then(d=>{
 D=d;ev=d.events;$('title').textContent=d.title;$('reciter').textContent=d.reciter;
 $('tags').innerHTML=(d.tags||[]).map(t=>`<span class="tag">${t[0]}: <b>${t[1]}</b></span>`).join('');
 a.src=d.audio;render(-1);const t=parseFloat(q.get('t'));if(t>0)a.addEventListener('loadedmetadata',()=>{a.currentTime=t},{once:true});tick();
});
function find(t){let lo=0,hi=ev.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(ev[m].s<=t){r=m;lo=m+1}else hi=m-1}return r}
function show(i){const vt=$('verse');if(idx!==-1&&i!==-1&&i!==idx){vt.classList.add('out');setTimeout(()=>{render(i);vt.classList.remove('out')},160)}else render(i)}
function render(i){
 idx=i;const e=ev[i];const vt=$('verse');
 if(!e||!e.k){vt.textContent=e&&e.label?e.label:'اضغط تشغيل';$('where').textContent='';$('taf').style.display='none';$('note').style.display='none';return}
 const v=D.verses[e.k];vt.innerHTML=v.text+`<span class="num">${ar(v.n)}</span>`;
 $('where').textContent='سورة '+v.sn+' · الآية '+ar(v.n);$('tt').textContent=v.tafsir;$('taf').style.display='';
 $('note').style.display=e.rep?'inline-block':'none';
}
function tick(){
 const t=a.currentTime,d=a.duration||0;
 if(!drag)$('fill').style.width=d?(t/d*100)+'%':'0';
 $('cur').textContent=fmt(t);$('rem').textContent='-'+fmt(d-t);
 const i=find(t);
 if(rep&&idx>=0&&i!==idx&&ev[idx]&&ev[idx].k&&!a.paused&&i>idx){a.currentTime=ev[idx].s;return}
 if(i!==idx)show(i);
}
a.addEventListener('timeupdate',tick);a.addEventListener('loadedmetadata',tick);setInterval(()=>{if(!a.paused)tick()},150);
const PL='M8 5v14l11-7z',PA='M6 5h4v14H6zm8 0h4v14h-4z';
$('play').onclick=()=>{a.paused?a.play():a.pause()};
a.addEventListener('play',()=>{$('ic').innerHTML=`<path d="${PA}"/>`;$('vc').classList.add('live')});
a.addEventListener('pause',()=>{$('ic').innerHTML=`<path d="${PL}"/>`;$('vc').classList.remove('live')});
function seekTo(x){const r=$('track').getBoundingClientRect();const p=Math.min(1,Math.max(0,(x-r.left)/r.width));a.currentTime=p*a.duration;$('fill').style.width=p*100+'%';tick()}
$('track').addEventListener('pointerdown',e=>{drag=true;$('track').setPointerCapture(e.pointerId);seekTo(e.clientX)});
$('track').addEventListener('pointermove',e=>{if(drag)seekTo(e.clientX)});
$('track').addEventListener('pointerup',()=>drag=false);
function jump(dir){const t=a.currentTime;let i=find(t);if(i<0)i=0;
 if(dir>0){for(let j=i+1;j<ev.length;j++){if(ev[j].k&&ev[j].k!==ev[i].k){a.currentTime=ev[j].s;return}}}
 else{let st=i;while(st>0&&ev[st-1].k===ev[i].k)st--;if(t-ev[st].s>3){a.currentTime=ev[st].s;return}
  for(let j=st-1;j>=0;j--){if(ev[j].k){let s=j;while(s>0&&ev[s-1].k===ev[j].k)s--;a.currentTime=ev[s].s;return}}a.currentTime=0}}
$('next').onclick=()=>jump(1);$('prev').onclick=()=>jump(-1);
$('rep').onclick=()=>{rep=!rep;$('rep').classList.toggle('on',rep)};
</script>
</body></html>
